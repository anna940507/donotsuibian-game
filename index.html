<style>

<body>
<div id="wrap">
<canvas id="c" width="360" height="640"></canvas>
<div id="spdw"><span>慢</span><input id="spd" type="range" min="0.5" max="1.8" step="0.05" value="1"><span>快</span></div>
<div id="start" class="ov hide">
  <h1>Don’t <b>隨便</b>！</h1>
  <h1 style="font-size:20px">主辦人大作戰</h1>
  <p>你是主辦人。<br>接住活動，排好 5 個環節：<br><b>地點 → 破冰 → 主活動 → 用餐 → 收尾</b><br><span class='sub'>重複或已滿還硬接扣 5 分<br>躲開「隨便」，提早排滿還加分！</span></p>
  <p><span class="chip" style="background:#7A8697">都隨便</span><span class="chip" style="background:#3E4959">看大家</span> 扣血 ✕</p>
  <p><span class="chip" style="background:#CFDDEE;color:#1F5A94;border:1.5px solid #5B8DBE">地點</span><span class="chip" style="background:#FDE19A;color:#2D3545;border:1.5px solid #D9A21B">破冰</span><span class="chip" style="background:#FCD9C8;color:#9A3412;border:1.5px solid #E75026">主活動</span><span class="chip" style="background:#D4EBDD;color:#2E6B4A;border:1.5px solid #4C8C6B">用餐</span><span class="chip" style="background:#E3DAF1;color:#2D3545;border:1.5px solid #8A6FB0">收尾</span><br><span class='sub'>方塊底色＝所屬環節，同環節用不同字色區分<br>上方格子同色，★＝必要環節</span></p>
  <p class="sub">←→／AD 左右移動，手機請手指左右拖曳</p>
  <button id="go">開始辦活動</button>
</div>
<div id="end" class="ov hide"></div>
<div id="goal" class="ov hide"></div>
</div>
<script>
const W=360,H=640,cv=document.getElementById('c'),g=cv.getContext('2d');const DPR=Math.min(3,Math.max(2,window.devicePixelRatio||1));cv.width=W*DPR;cv.height=H*DPR;

A:{t:'靠譜企劃高手',c:'#4C8C6B',r:'偶爾被「沒意見」擦傷，但大方向穩穩的。同事嘴上說隨便，心裡其實給你按了讚。',a:'離滿分只差一點點默契。讓 Don’t隨便 AI 平台先幫大家投票收斂需求，你就能把力氣花在把活動辦得更好。'},
B:{t:'辛苦了的盲猜主辦人',c:'#5B8DBE',r:'你猜了很久，大家笑得有點禮貌。活動沒翻車，但也沒人記得。你的髮量替你默默付出。',a:'別再憑直覺盲猜口味。Don’t隨便 AI 平台幫你蒐集偏好、排好 Run-down，不用再半夜在群組問「到底想吃什麼」。'},
C:{t:'被「隨便」淹沒的受害者',c:'#7A8697',r:'「看大家」「都可以」像潮水一樣襲來，你問了十個人得到零個答案。活動辦成了集體發呆。',a:'與其追著人問，不如讓 Don’t隨便 AI 平台代你問。一鍵收集意見，把「隨便」翻譯成具體選項。'},

};
let st='ready',P,items,floats,keys={},tgt=null,hp,score,time,spawn,shake,got,lastT,flash,tries,bullets,fireT,banner,idx,goalAt,laneBag,typeBag,deck,slots,goal,done;
let hits=0,dups=0,spd=0,dupLog=[],recent=[],boost=0,logoAt=[],skipN=0,appT=0,appC=0,appL=0,bldC=0,bldL=0,appBad=0;
function reset(){P={x:W/2,y:H-190,r:20,vx:0};items=[];floats=[];hp=100;score=0;time=TOTAL;spawn=0;shake=0;got=[];flash=0;tries={};tgt=null;bullets=[];fireT=.3;banner=null;idx=0;laneBag=[];typeBag=[];deck=[];slots={};hits=0;dups=0;spd=0;dupLog=[];recent=[];boost=0;logoAt=5;skipN=0;appT=0;appC=0;appL=0;bldC=0;bldL=0;appBad=0;streak=0;comboPts=0;appPts=0;likePts=0;done=false;goal=GOALSET[0]}
function rnd(a,b){return a+Math.random()*(b-a)}
const TOTAL=55,SLOTS=['地點','破冰','主活動','用餐','收尾'],CAP={地點:1,破冰:2,主活動:2,用餐:1,收尾:2};
const SLOT_OF={酒吧包場:'地點',戶外公園:'地點',會議室:'地點',咖啡廳:'地點',桌遊破冰:'破冰',兩真一假:'破冰',自介接力:'破冰',才藝表演:'主活動',團康競賽:'主活動',密室逃脫:'主活動',精緻外燴:'用餐',烤肉趴:'用餐',下午茶:'用餐',抽獎環節:'收尾',大合照:'收尾',心得分享:'收尾'};
const GOALSET=[{n:'提升跨部門默契',need:['破冰','用餐']}];
const SLOTC={地點:'#5B8DBE',破冰:'#D9A21B',主活動:'#E75026',用餐:'#4C8C6B',收尾:'#8A6FB0'};
const SLOTBG={地點:'#CFDDEE',破冰:'#FDE19A',主活動:'#FCD9C8',用餐:'#D4EBDD',收尾:'#E3DAF1'};
const TXTC=['#2D3545','#1F5A94','#9A3412','#2E6B4A'],TXT={};
for(const sl of SLOTS)TARGETS.filter(t=>SLOT_OF[t]===sl).forEach((t,i)=>TXT[t]=TXTC[i]);
for(const t in SLOT_OF)COL[t]=SLOTBG[SLOT_OF[t]];
MINES.forEach((m,i)=>COL[m]=COL[m]||['#7A8697','#3E4959','#5E6B7C','#2D3545'][i%4]);
const LIKE={桌遊破冰:'阿杰',精緻外燴:'小美',才藝表演:'Tina',團康競賽:'老王',大合照:'小琪'};
function pickText(el){
  if(boost<=0&&Math.random()<.1+.1*el/TOTAL)return MINES[Math.random()*MINES.length|0];
  const open=TARGETS.filter(t=>{const a=slots[SLOT_OF[t]]||[];return a.length<CAP[SLOT_OF[t]]&&!a.includes(t)}),need=open.filter(t=>goal.need.includes(SLOT_OF[t])),filled=TARGETS.filter(t=>slots[SLOT_OF[t]]);
  const lk=open.filter(t=>LIKE[t]),r=Math.random();let pool=boost>0?(lk.length>=3?lk:[...new Set([...lk,...need,...open])]):r<.3&&lk.length?lk:r<.5?need:r<.93?open:TARGETS;
  if(!pool.length)pool=TARGETS;
  return pool[Math.random()*pool.length|0]
}
function catchT(o){
  const sl=SLOT_OF[o.t],a=slots[sl]=slots[sl]||[];
  if(a.includes(o.t)||a.length>=CAP[sl]){if(a.includes(o.t))tries[o.t]=(tries[o.t]||0)+1;dups++;if(boost>0)appBad++;dupLog.push({t:o.t,sl,same:a.includes(o.t)});score-=5;shake=.2;banner={t:a.includes(o.t)?'⚠️ 「'+o.t+'」重複了！':'⚠️ 「'+sl+'」已經排滿了！',l:1.5};say('−5',o.x,o.y,C.org);return true}
  a.push(o.t);got.push(o.t);if(boost>0){appC++;if(LIKE[o.t])appL++}else{bldC++;if(LIKE[o.t])bldL++}let pts=5;
  if(goal.need.includes(sl))pts+=4;
  if(LIKE[o.t]){const lb=o.b?8:2;pts+=lb;likePts+=lb;say((o.b?'⭐ ':'🤔 猜中 ')+LIKE[o.t],o.x,o.y-18,C.ok)}else if(o.b){pts+=3;likePts+=3;say('⭐ App 推薦 +3',o.x,o.y-18,C.ok)}
  score+=pts;say('+'+pts+' '+o.t,o.x,o.y,C.ok);

  return true
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function addItem(){
  g.font='bold 17px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  const n=idx++,el=TOTAL-time;let o;
  {
    let t;
    let k2=0;do{t=pickText(el)}while(recent.includes(t)&&k2++<12);recent.push(t);if(recent.length>9)recent.shift();
    o={k:MINES.includes(t)?'m':'t',t,col:COL[t],tc:TXT[t]||'#fff'}
  }
  {o.w=Math.max(g.measureText(o.t).width+24,90);o.h=o.k==='t'?42:34}
  let bx=W/2,bd=-1e9;
  for(let q=0;q<16;q++){const x=rnd(o.w/2+4,W-o.w/2-4);let d=1e9;for(const m of items)if(m.y<200)d=Math.min(d,Math.abs(x-m.x)-(o.w+m.w)/2);if(d>bd){bd=d;bx=x}}

}
function addBonus(){
  g.font='bold 17px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';

  pk.forEach((t,i)=>{const o={k:'t',b:1,t,col:COL[t],tc:TXT[t]||'#fff'};o.w=Math.max(g.measureText(t).width+24,90);o.h=42;o.x=i?rnd(220,300):rnd(60,140);o.y=i?70:110;o.v=rnd(80,95)+(TOTAL-time)/TOTAL*20;items.push(o);say('⭐',o.x,o.y+24,C.sun)})
}
function say(t,x,y,col){floats.push({t,x,y,col,l:1})}
function hitRect(o){
  const cx=Math.max(o.x-o.w/2,Math.min(P.x,o.x+o.w/2)),cy=Math.max(o.y-o.h/2,Math.min(P.y,o.y+o.h/2));

function upd(dt){

  else if(tgt){P.x+=(tgt.x-P.x)*Math.min(1,16*dt)}

    if(o.k==='m'){{hp-=15;hits++;streak=0;try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}if(boost>0)appBad++;score-=8;shake=.3;flash=.25;say('−8 敷衍！',o.x,o.y,C.org)}}
    else if(o.k==='t'){
      catchT(o);
    }else{hp=Math.min(100,hp+10);for(const m of items){if(m.dead)continue;if(m.k==='m'){m.dead=1;say('✕',m.x,m.y,C.sub)}else if(m.k==='t'){const a=slots[SLOT_OF[m.t]]||[];if(a.includes(m.t)||a.length>=CAP[SLOT_OF[m.t]]){m.dead=1;say('✕ 重複',m.x,m.y,C.sub)}}}banner={t:'📱 App 啟動！清掉雷區，2 個加分方塊降落',l:1.6};say('📱 收集喜好',o.x,o.y,C.brand);addBonus()}

  shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);if(boost>0)appT+=Math.min(dt,boost);boost=Math.max(0,boost-dt);if(banner)banner.l-=dt;

}
function rr(x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}
function logo(x,y){const t=performance.now()/1000;g.save();g.translate(x,y+Math.sin(t*5)*2);g.scale(1.2,1.2);
  g.fillStyle=C.sun;g.globalAlpha=.65;g.beginPath();g.arc(0,0,27+Math.sin(t*6)*2,0,7);g.fill();g.globalAlpha=1;
  g.fillStyle=C.cream;g.beginPath();g.arc(0,0,23,0,7);g.fill();g.strokeStyle=C.brand;g.lineWidth=2;g.stroke();
  g.strokeStyle=C.ink;g.lineWidth=3;rr(-17,-10,24,24,5);g.stroke();g.fillStyle=C.ink;g.fillRect(-12,-13,3,6);g.fillRect(-2,-13,3,6);

  if(k==='S'||k==='A'){const cw=document.createElement('div');cw.className='cfw';for(let i=0;i<40;i++){const c=document.createElement('i');c.className='cf';c.style.left=rnd(0,100)+'%';c.style.background=[C.org,C.sun,C.brand,C.ok][i%4];c.style.animationDelay=(rnd(0,1.2)+.8)+'s';cw.appendChild(c)}document.getElementById('wrap').appendChild(cw)}
  document.getElementById('again').onclick=begin
}
function brief(){
  st='brief';const gl=document.getElementById('goal');
  const chip=(t,bg,fg,x='')=>`<span style="display:inline-block;padding:9px 14px;border-radius:12px;background:${bg};color:${fg};font-weight:800;font-size:18px;${x}">${t}</span>`;
  const step=(n,inner)=>`<div class="card" style="padding:12px 10px;margin:7px 0"><div style="display:flex;align-items:center;gap:8px"><span style="flex:none;width:26px;height:26px;border-radius:50%;background:#2D3545;color:#fff;font-weight:800;font-size:14px;line-height:26px;text-align:center">${n}</span><div style="flex:1;text-align:center">${inner}</div></div></div>`;
  const big=(t,c)=>`<div style="font-weight:800;font-size:17px;color:${c};margin-top:6px">${t}</div>`;
  const box=(t,s)=>`<span style="display:inline-block;padding:7px 3px;width:19%;box-sizing:border-box;border-radius:9px;background:${SLOTBG[s]};border:2px solid ${SLOTC[s]};font-size:13px;font-weight:800;color:#2D3545">${t}</span>`;
  const ball='<span style="width:34px;height:34px;border-radius:50%;background:#5B8DBE;display:inline-block;position:relative"><i style="position:absolute;left:10px;top:12px;width:5px;height:5px;border-radius:50%;background:#000"></i><i style="position:absolute;right:10px;top:12px;width:5px;height:5px;border-radius:50%;background:#000"></i></span>';
  gl.innerHTML=`<h1 style="font-size:28px">Don’t <b>隨便</b>！</h1>
  ${step(1,`<div style="display:flex;justify-content:center;align-items:center;gap:14px;font-size:26px;color:#7A8697">👈${ball}👉</div>${big('藍色圓球＝你（主辦方）','#5B8DBE')}<div style="font-size:14px;font-weight:700;color:#2D3545;margin-top:2px">左右滑動，接住掉下來的方塊</div>`)}
  ${step(2,`<div style="display:flex;justify-content:space-around;align-items:flex-start"><div>${chip('桌遊破冰','#FDE19A','#9A3412')}${big('✅ 接活動','#4C8C6B')}<div style="font-size:13px;color:#4C8C6B;font-weight:700">+5 分</div></div><div>${chip('隨便','#5E6B7C','#fff')}${big('❌ 躲隨便','#E75026')}<div style="font-size:13px;color:#E75026;font-weight:700">−8 分</div></div></div>`)}
  ${step(3,`<div style="display:flex;justify-content:space-between;gap:2px">${SLOTS.map(s=>box(s,s)).join('')}</div>${big('目標：5 格各接滿就過關 🎉','#2D3545')}<div style="margin-top:8px;padding:8px 6px;border-radius:10px;background:#FCD9C8"><div style="display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap">${chip('桌遊破冰','#FDE19A','#9A3412','font-size:14px;padding:6px 10px')}<span style="font-size:15px;font-weight:800;color:#2D3545">已接過 / 該格已滿</span><span style="font-size:18px">➜</span>${chip('再接 −5','#E75026','#fff','font-size:14px;padding:6px 10px')}</div><div style="font-size:12px;color:#9A3412;font-weight:700;margin-top:4px">重複接、或接到已滿的格子，都會扣 5 分！</div></div>`)}
  ${step(4,`<div style="display:flex;justify-content:center;align-items:center;gap:8px"><span style="display:inline-block;width:46px;height:46px;line-height:46px;border-radius:50%;background:#E75026;font-size:24px">📱</span><span style="font-size:22px;color:#7A8697">➜</span><div>${chip('隨便','#5E6B7C','#fff','opacity:.4;font-size:13px;padding:5px 8px;text-decoration:line-through')}${chip('重複','#FDE19A','#9A3412','opacity:.4;font-size:13px;padding:5px 8px;text-decoration:line-through;margin-left:3px')}</div></div>${big('接到 Logo：清掉畫面上的「隨便」和「重複」方塊','#2D3545')}<div style="font-size:13px;color:#B7791F;font-weight:700;margin-top:2px">還會掉下 2 個加分方塊，並回復 10 點耐心</div>`)}
  <div class="card" style="text-align:center;margin:7px 0;font-size:13px">🎯 本次目標　<b style="font-size:16px;color:#2D3545">${goal.n}</b><br><span style="color:#B7791F;font-weight:700">⭐ 發光的方塊 ＝ 同事推薦，+8</span></div>
  <button id="ok" style="font-size:20px;padding:13px 44px">開始！</button>`;
  gl.classList.remove('hide');document.getElementById('ok').onclick=()=>{gl.classList.add('hide');st='play'}
}
function begin(){
  document.querySelectorAll('.cfw').forEach(x=>x.remove());reset();document.getElementById('start').classList.add('hide');document.getElementById('end').classList.add('hide');brief()
}
document.getElementById('go').onclick=begin;
addEventListener('keydown',e=>{if(e.key===' ')e.preventDefault();keys[e.key]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('blur',()=>{keys={}});document.addEventListener('contextmenu',e=>e.preventDefault());

addEventListener('keyup',e=>keys[e.key]=0);
let dragX=0,dragP=0;function pt(e){const r=cv.getBoundingClientRect();tgt={x:dragP+(e.clientX-dragX)/r.width*W*1.4}}
cv.addEventListener('pointerdown',e=>{dragX=e.clientX;dragP=P.x;tgt={x:P.x};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pt(e)});
document.getElementById('spd').addEventListener('input',e=>{spdM=+e.target.value});
document.addEventListener('visibilitychange',()=>{lastT=performance.now()});
reset();brief();requestAnimationFrame(loop);
</script>
</body>
</html>
