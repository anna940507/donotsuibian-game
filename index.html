<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="color-scheme" content="light only"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DON'T 隨便｜你是哪種活動怪？</title>
<style>
html{color-scheme:light only}:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ee;--fg:#2b2118;--card:#fff;--ac:#ff7a3d;--mut:#8a7a6a;--bd:#f0dfc8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.6}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0}h2{font-size:20px;margin:12px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.btn{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}
.btn:active{border-color:var(--ac);background:var(--bd)}
.go{background:var(--ac);color:#fff;border:0;text-align:center;font-weight:700;font-size:17px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.mut{color:var(--mut);font-size:14px}.em{font-size:56px;text-align:center}
.q{font-style:italic;font-weight:600;margin:8px 0}.tag{color:var(--ac);font-size:14px}
.c{text-align:center}.bimg{display:block;width:100%;max-width:420px;border-radius:12px;margin:0 auto}
.e-s67 span{display:inline-block;font-weight:800;font-size:64px;margin:0 4px}.e-s67 .d1{animation:ud .3s ease-in-out infinite alternate}.e-s67 .d2{animation:ud .3s ease-in-out infinite alternate-reverse}
@keyframes ud{from{transform:translateY(-14px)}to{transform:translateY(14px)}}@keyframes dodge{0%{opacity:0;transform:translateX(-70px)}20%,60%{opacity:1;transform:none}80%,100%{opacity:0;transform:translateX(80px)}}@keyframes zoom{0%,100%{transform:scale(1)}50%{transform:scale(1.7)}}
.rev .em.e-s67{animation:none}.rev .em.e-pg{animation:dodge 2.4s ease-in-out infinite}.rev .em.e-snark{animation:zoom .8s ease-in-out .5s 3}.card{background:color-mix(in srgb,var(--ac) 10%,var(--card));border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
.dot{width:32px;height:32px;border-radius:50%!important;border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--bd);padding:0;margin:0 5px;cursor:pointer}.dot.on{box-shadow:0 0 0 2.5px var(--fg)}*{-webkit-tap-highlight-color:transparent}button{outline:none;-webkit-appearance:none;appearance:none;border-radius:12px}button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}.mini{border:1.5px solid var(--bd);border-radius:12px;padding:12px 8px;text-align:center}.mini small{display:block;color:var(--mut);font-size:12px}.mini div{font-size:36px;line-height:1.3}.mini b{font-size:14px}.btn{transition:transform .12s,border-color .12s}.btn:active,.sel{transform:scale(.97);border-color:var(--ac);background:var(--bd)}
@keyframes pop{0%{opacity:0;transform:scale(.85) translateY(24px)}60%{transform:scale(1.03)}100%{opacity:1;transform:none}}@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes gr{from{width:0}}
.rev{animation:pop .6s ease-out both}.rev .em{animation:bn .9s ease .6s 2}.st u{animation:gr .9s ease-out .6s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.st{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}.st b{width:64px;font-weight:400}.st i{flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.st u{display:block;height:100%;background:var(--ac)}.st span{width:30px;text-align:right;color:var(--mut)}
