<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don’t 隨便！主辦人大作戰</title>
<style>
:root{--bg:#FFF8ED;--ink:#3E4959;--head:#2D3545;--brand:#E75026;--blue:#5B8DBE;--sky:#CFDDEE;--ice:#E6F0FA;--ok:#4C8C6B;--sub:#7A8697;--sun:#FDE19A;--peach:#FCD9C8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E2430;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E2430}
html,body{height:100%;margin:0;background:var(--bg);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);box-sizing:border-box}
#wrap{position:relative;width:min(100vw,calc(100dvh*0.5625));aspect-ratio:9/16;background:#FFF8ED;box-shadow:0 4px 24px #0003;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;background:#FFF8EDf2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;touch-action:pan-y;padding:14px 14px 22px;box-sizing:border-box;text-align:center;color:#3E4959;overflow-y:auto;overscroll-behavior:contain}
.ov{z-index:7}#goal{background:rgba(45,53,69,.55);padding:0;justify-content:flex-end;align-items:stretch;overflow:hidden}#goal.hasspot{background:transparent}
.sheet{display:flex;flex-direction:column;min-height:340px;background:#FFF8ED;border-radius:26px 26px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px #0003;animation:sheetUp .35s ease-out both;text-align:center}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:10px}.dots i{width:9px;height:9px;border-radius:50%;background:#CFDDEE}.dots i.on{background:#E75026;width:22px;border-radius:5px}
.sheet .vis{margin:10px 0 12px;min-height:84px;display:flex;align-items:center;justify-content:center;gap:14px}
.sheet .txt{font-size:17px;line-height:1.55;font-weight:800;color:#2D3545;text-wrap:balance}
.sheet .txt b{color:#E75026}.sheet .sub2{margin-top:10px;font-size:14px;line-height:1.5;font-weight:700;color:#B7791F;text-wrap:balance}
.sheet h1{font-size:21px;line-height:1.3;margin:2px 0 0}
.sheet .bt{margin-top:auto;padding-top:14px;display:flex;gap:10px;justify-content:center;align-items:center}
.sheet button{margin:0;display:block;font-size:20px;padding:12px 40px;box-shadow:0 4px 0 #b83c1a}.sheet button:active{transform:translateY(3px);box-shadow:0 1px 0 #b83c1a}
.sheet button.back{background:#fff;color:#5B8DBE;border:2px solid #CFDDEE;box-shadow:none;padding:10px 20px;font-size:17px}.sheet button.back:active{transform:none;background:#E6F0FA}
#goal.sheetTop{justify-content:flex-start}#goal.sheetTop .sheet{border-radius:0 0 26px 26px;animation-name:sheetDown}
@keyframes sheetDown{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideK{from{left:8%}to{left:72%}}
#end{background:#FFF8ED}
.scene{position:relative;width:100%;height:132px;border-radius:14px;background:linear-gradient(#E6F0FA,#FFF8ED);overflow:hidden;border:1.5px solid #CFDDEE}
.scene .b{position:absolute;transform:translateX(-50%);padding:6px 12px;border-radius:10px;font-weight:800;font-size:15px;white-space:nowrap}
.scene .y{left:26%;top:-40px;background:#FDE19A;color:#9A3412;border:2.5px solid #D9A21B;animation:fallY 4s linear infinite}
.scene .g{left:50%;top:-40px;background:#8A94A3;color:#fff;border:2.5px solid #5E6B7C;animation:fallG 4s linear infinite}
.scene .p{position:absolute;left:50%;bottom:8px;margin-left:-20px;width:40px;height:40px;border-radius:50%;background:#5B8DBE;animation:ballM 4s ease-in-out infinite,catchB 4s linear infinite}
.scene .p i{position:absolute;top:15px;width:5px;height:5px;border-radius:50%;background:#000}.scene .p i:first-child{left:11px}.scene .p i:last-child{right:11px}
.scene .t{position:absolute;transform:translateX(-50%);padding:2px 12px;border-radius:12px;color:#fff;font-size:14px;font-weight:800;opacity:0}
.scene .t1{left:26%;top:22px;background:#4C8C6B;animation:tag1 4s linear infinite}
.scene .t2{left:76%;top:44px;background:#E75026;animation:tag2 4s linear infinite}
.scene .fl{position:absolute;left:0;right:0;bottom:0;height:8px;background:#CFDDEE}
@keyframes ballM{0%,6%{left:50%}24%,34%{left:26%}48%,54%{left:50%}64%,84%{left:76%}96%,100%{left:50%}}
@keyframes fallY{0%{top:-40px;opacity:1;transform:translateX(-50%) scale(1)}29%{top:50px;opacity:1;transform:translateX(-50%) scale(1)}32%{top:52px;opacity:0;transform:translateX(-50%) scale(1.4)}99%{top:52px;opacity:0;transform:translateX(-50%) scale(1.4)}100%{top:-40px;opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes fallG{0%,46%{top:-40px;opacity:1}78%{top:92px;opacity:1}86%{top:92px;opacity:0}100%{top:-40px;opacity:0}}
@keyframes catchB{0%,30%{transform:scale(1)}34%{transform:scale(1.22)}40%,100%{transform:scale(1)}}
@keyframes tag1{0%,31%{opacity:0}35%,54%{opacity:1}60%,100%{opacity:0}}
@keyframes tag2{0%,62%{opacity:0}68%,88%{opacity:1}94%,100%{opacity:0}}
#pv,#pv *{-webkit-user-select:auto;user-select:auto}#pv img{-webkit-touch-callout:default !important;pointer-events:auto}
#pv{background:#FFF8ED;z-index:10;padding-top:12px}#pv img{width:92%;max-width:100%;border-radius:12px;box-shadow:0 4px 18px #0003;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#pv .row{display:flex;gap:10px;margin:10px 0 4px}#pv button{margin:0;font-size:17px;padding:10px 22px}

.spot{position:absolute;left:5px;right:5px;top:4px;height:calc(21.5% - 6px);border:3px solid #E75026;border-radius:14px;box-shadow:0 0 0 2000px rgba(45,53,69,.55);animation:pulse .9s infinite alternate;pointer-events:none}
@keyframes pulse{to{border-color:#FFC93C}}
.spotTag{position:absolute;left:50%;transform:translateX(-50%);top:calc(21.5% + 6px);background:#E75026;color:#fff;font-weight:800;font-size:14px;padding:5px 14px;border-radius:14px;white-space:nowrap;box-shadow:0 3px 10px #0004}
.ball{position:relative;flex:none;width:52px;height:52px;border-radius:50%;background:#5B8DBE;animation:sway 1.6s ease-in-out infinite alternate}
.ball i{position:absolute;top:19px;width:6px;height:6px;border-radius:50%;background:#000}.ball i:first-child{left:14px}.ball i:last-child{right:14px}
@keyframes sway{from{transform:translateX(-28px)}to{transform:translateX(28px)}}
.ch{font-size:30px;font-weight:800;color:#9AA5B5;letter-spacing:-3px}
.nw{white-space:nowrap}
#mute{position:absolute;right:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:9;margin:0;padding:2px 9px;background:rgba(255,255,255,.85);color:#2D3545;font-size:14px;border-radius:12px;border:1px solid #CFDDEE}
.ov.hide{display:none}.ov>*{flex-shrink:0;max-width:100%}.ov>:first-child{margin-top:auto}#again,#go,#ok{margin-bottom:auto}.cfw{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6}

h1{margin:0 0 6px;color:#2D3545;font-size:26px}
h1 b{color:#E75026}
p{margin:6px 0;font-size:14px;line-height:1.5}
.sub{color:#7A8697;font-size:12px}
button{margin-top:14px;background:#E75026;color:#fff;border:0;border-radius:24px;padding:12px 34px;font-size:17px;font-weight:700;font-family:inherit}
.chip{display:inline-block;padding:3px 10px;border-radius:10px;margin:2px;font-size:12px;color:#fff}
.card{background:#fff;border-radius:14px;padding:10px 14px;margin:6px 0;width:100%;box-sizing:border-box;text-align:left;font-size:13px;line-height:1.5}
.big{font-size:44px;font-weight:800;color:#E75026;line-height:1}
.rd{text-align:left;font-size:13px;margin:0;padding-left:0;list-style:none}
.rd li{padding:2px 0;border-bottom:1px dashed #CFDDEE}
.rd span{color:#5B8DBE;font-weight:700;margin-right:8px}
.ai{background:#FDE19A}.roast{background:#FCD9C8}
.pb{display:block;flex:1;height:8px;background:#CFDDEE;border-radius:4px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#4C8C6B;border-radius:4px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.pr{display:flex;align-items:center;gap:6px;font-size:12px;margin:5px 0}
.pr .n{width:96px;white-space:nowrap;text-align:left}.pr .e{width:22px;font-size:16px}.pr .v{width:30px;text-align:right;font-weight:700}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(720px) rotate(540deg)}}
.pop{animation:pop .7s both}.up{animation:up .5s both}
.cf{position:absolute;top:-14px;width:8px;height:12px;animation:fall 2.4s linear forwards;pointer-events:none}
.bd{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}.bd b{color:#4C8C6B}.bd.neg b{color:#E75026}
#spdw{position:absolute;left:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#7A8697;background:rgba(255,255,255,.75);border-radius:12px;padding:1px 8px}#spd{width:70px;height:18px;margin:0;accent-color:#5B8DBE}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="640"></canvas>
<div id="spdw"><span>慢</span><input id="spd" type="range" min="0.5" max="1.8" step="0.05" value="1"><span>快</span></div>
<button id="mute" aria-label="音樂開關">🔊</button>
<div id="start" class="ov hide">
  <h1>Don’t <b>隨便</b>！</h1>
  <h1 style="font-size:20px">主辦人大作戰</h1>
  <p>你是主辦方。<br>接住活動，排好 5 個環節：<br><b>地點 → 破冰 → 主活動 → 用餐 → 收尾</b><br><span class='sub'>重複或已滿還硬接扣 5 分<br>躲開「隨便」，提早排滿還加分！</span></p>
  <p><span class="chip" style="background:#7A8697">都隨便</span><span class="chip" style="background:#3E4959">看大家</span> 扣血 ✕</p>
  <p><span class="chip" style="background:#CFDDEE;color:#1F5A94;border:1.5px solid #5B8DBE">地點</span><span class="chip" style="background:#FDE19A;color:#2D3545;border:1.5px solid #D9A21B">破冰</span><span class="chip" style="background:#FCD9C8;color:#9A3412;border:1.5px solid #E75026">主活動</span><span class="chip" style="background:#D4EBDD;color:#2E6B4A;border:1.5px solid #4C8C6B">用餐</span><span class="chip" style="background:#E3DAF1;color:#2D3545;border:1.5px solid #8A6FB0">收尾</span><br><span class='sub'>方塊底色＝所屬環節，同環節用不同字色區分<br>上方格子同色，★＝必要環節</span></p>
  <p class="sub">←→／AD 左右移動，手機請手指左右拖曳</p>
  <button id="go">開始辦活動</button>
</div>
<div id="end" class="ov hide"></div>
<div id="goal" class="ov hide"></div>
</div>

    `<div class="sheet"><div class="dots">${STEPS.map((_,i)=>`<i class="${i===n?'on':''}"></i>`).join('')}</div>
      ${S.head?`<h1>${S.head}</h1>`:''}
      ${S.html?`<div style="margin-top:10px">${S.html}</div>`:`<div class="vis">${S.vis}</div><div class="txt">${S.txt}</div>${S.sub?`<div class="sub2">${S.sub}</div>`:''}`}
      <div class="bt">${n?'<button class="back" id="bk">上一步</button>':''}<button id="ok">${last?'確定，開始遊戲！':'確定'}</button></div></div>`;
    if(sp&&sp.slider){sw.style.zIndex=8;const g=gl.getBoundingClientRect(),r=sw.getBoundingClientRect();
      const d=document.createElement('div');d.className='spot';Object.assign(d.style,{left:(r.left-g.left-6)+'px',top:(r.top-g.top-5)+'px',width:(r.width+12)+'px',height:(r.height+10)+'px',right:'auto'});
      const t=document.createElement('div');t.className='spotTag';t.textContent=sp.tag;Object.assign(t.style,{left:(r.left-g.left)+'px',top:(r.top-g.top-38)+'px',transform:'none'});
      gl.insertBefore(t,gl.firstChild);gl.insertBefore(d,gl.firstChild)}
    document.getElementById('ok').onclick=()=>{if(last){sw.style.zIndex='';gl.classList.add('hide');gl.classList.remove('hasspot','sheetTop');st='play'}else{n++;render()}};
    const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{n--;render()};
  }
  gl.classList.remove('hide');render();
}
/* ===== 8-bit BGM (WebAudio, no files) ===== */
let AC=null,mg=null,nb=null,musicOn=true,nextT=0,stepI=0;
const STEP_S=60/150/2,MEL=[[76,79,84,79,76,79,76,74],[76,81,84,81,76,81,79,76],[77,81,84,81,77,81,79,77],[79,83,86,83,79,83,81,79],[84,0,79,76,79,0,76,0],[81,0,76,72,76,0,81,0],[77,0,81,84,81,0,77,0],[79,81,83,86,83,81,79,0]],ROOT=[48,45,41,43,48,45,41,43];
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(type,fr,t,d,v){const o=AC.createOscillator(),e=AC.createGain();o.type=type;o.frequency.value=fr;e.gain.setValueAtTime(v,t);e.gain.setValueAtTime(v,t+d*.6);e.gain.linearRampToValueAtTime(0,t+d);o.connect(e);e.connect(mg);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v,ft,fq){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),e=AC.createGain();s.buffer=nb;f.type=ft;f.frequency.value=fq;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(e);e.connect(mg);s.start(t);s.stop(t+d+.02)}
function kick(t){const o=AC.createOscillator(),e=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);e.gain.setValueAtTime(.35,t);e.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(e);e.connect(mg);o.start(t);o.stop(t+.16)}
function playStep(i,t){const bar=i>>3,k=i&7,m=MEL[bar][k];
  if(m)tone('square',mf(m),t,STEP_S*1.7,.05);
  tone('triangle',mf(ROOT[bar]+(k&1?12:0)),t,STEP_S*.9,.16);
  if(k===0||k===4)kick(t);if(k===2||k===6)noise(t,.1,.09,'bandpass',1800);if(k&1)noise(t,.04,.035,'highpass',7000)}
function tick(){while(nextT<AC.currentTime+.3){playStep(stepI,nextT);nextT+=STEP_S;stepI=(stepI+1)%64}}
function startMusic(){
  if(!AC){const C0=window.AudioContext||window.webkitAudioContext;if(!C0)return;AC=new C0();mg=AC.createGain();mg.gain.value=musicOn?.5:0;mg.connect(AC.destination);
    nb=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    nextT=AC.currentTime+.15;setInterval(()=>{if(AC.state==='running')tick()},50)}
  if(AC.state==='suspended')AC.resume()}
['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,startMusic,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(musicOn||true)AC.resume()});
document.getElementById('mute').onclick=e=>{e.stopPropagation();startMusic();musicOn=!musicOn;mg.gain.setTargetAtTime(musicOn?.5:0,AC.currentTime,.05);e.target.textContent=musicOn?'🔊':'🔇'};
function begin(){
  document.querySelectorAll('.cfw').forEach(x=>x.remove());reset();document.getElementById('start').classList.add('hide');document.getElementById('end').classList.add('hide');brief()
}
document.getElementById('go').onclick=begin;
addEventListener('keydown',e=>{if(e.key===' ')e.preventDefault();keys[e.key]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('blur',()=>{keys={}});document.addEventListener('contextmenu',e=>{if(!(e.target.closest&&e.target.closest('#pv')))e.preventDefault()});

addEventListener('keyup',e=>keys[e.key]=0);
let dragX=0,dragP=0;function pt(e){const r=cv.getBoundingClientRect();tgt={x:dragP+(e.clientX-dragX)/r.width*W*1.4}}
cv.addEventListener('pointerdown',e=>{dragX=e.clientX;dragP=P.x;tgt={x:P.x};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pt(e)});
document.getElementById('spd').addEventListener('input',e=>{spdM=+e.target.value});
document.addEventListener('visibilitychange',()=>{lastT=performance.now()});
reset();brief();requestAnimationFrame(loop);
</script>
